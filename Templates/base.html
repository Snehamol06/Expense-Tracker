
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06372a">

    <title>
        {% block title %}
        Expense Tracker
        {% endblock %}
    </title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: #f5f7f5;
            color: #17221d;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.55;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            top: 16px;
            left: 16px;

            width: 230px;
            height: calc(100vh - 32px);

            background: #03271d;
            color: white;

            padding: 24px 14px;
            border-radius: 14px;

            z-index: 1000;
            overflow-y: auto;

            display: flex;
            flex-direction: column;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #31584c;
            border-radius: 10px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 0 10px;

            margin-top: 10px;
            margin-bottom: 22px;

            font-size: 16px;
            font-weight: 700;
            line-height: 1.45;

            color: white;
            flex-shrink: 0;
        }

        .logo-mark {
            width: 29px;
            height: 29px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #b8f000;
            font-size: 23px;
            font-weight: 700;

            flex-shrink: 0;
        }

        /* =========================
           MENU SECTION
        ========================= */

        .menu-section-title {
            padding: 0 10px;
            margin-bottom: 10px;

            color: #8ba69c;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .menu-section-title:not(:first-of-type) {
            margin-top: 23px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 4px;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 11px;

            min-height: 43px;
            padding: 10px 11px;

            color: #a1b8af;
            border-radius: 8px;

            font-size: 13px;
            font-weight: 500;
            line-height: 1.45;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .menu a:hover {
            background: #0b3b2d;
            color: white;
            transform: translateX(2px);
        }

        .menu a.active {
            background: #0b3a2c;
            color: white;
        }

        .menu-icon {
            width: 23px;
            height: 23px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 5px;
            color: #9bb4aa;

            font-size: 10px;
            font-weight: 700;
        }

        .menu a.active .menu-icon {
            color: #b8f000;
        }

        /* =========================
           LOGOUT
        ========================= */

        .logout {
            margin-top: auto;
            padding-top: 22px;
        }

        .logout a {
            display: flex;
            align-items: center;
            gap: 11px;

            min-height: 43px;
            padding: 10px 11px;

            border-radius: 8px;
            color: #a1b8af;

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s ease;
        }

        .logout a::before {
            content: "↪";
            font-size: 17px;
        }

        .logout a:hover {
            background: #0b3b2d;
            color: white;
        }

        /* =========================
           MOBILE CLOSE BUTTON
        ========================= */

        .close-menu {
            display: none;

            position: absolute;
            top: 14px;
            right: 12px;

            width: 33px;
            height: 33px;

            border: none;
            border-radius: 7px;
            background: transparent;
            color: #d0ded8;

            font-size: 24px;
            cursor: pointer;
        }

        .close-menu:hover {
            background: #0b3b2d;
        }

        /* =========================
           MOBILE OVERLAY
        ========================= */

        .overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(2px);

            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        /* =========================
           MAIN LAYOUT
        ========================= */

        .main {
            margin-left: 262px;
            width: calc(100% - 262px);

            min-height: 100vh;
            padding: 20px 23px 40px;
        }

        .content {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
        }

        .page-content {
            width: 100%;
            min-width: 0;
        }

        /* =========================
           MOBILE MENU BUTTON
        ========================= */

        .menu-button {
            display: none;

            width: 41px;
            height: 41px;
            flex-shrink: 0;

            border: none;
            border-radius: 9px;

            background: #06372a;
            color: white;

            font-size: 19px;
            cursor: pointer;

            align-items: center;
            justify-content: center;

            transition: background 0.2s ease;
        }

        .menu-button:hover {
            background: #0b4b38;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1100px) {
            .sidebar {
                width: 215px;
            }

            .main {
                margin-left: 245px;
                width: calc(100% - 245px);
                padding: 18px 17px 32px;
            }

            .menu a {
                font-size: 12.5px;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 205px;
                left: 12px;
            }

            .main {
                margin-left: 230px;
                width: calc(100% - 230px);
                padding-left: 14px;
                padding-right: 14px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {
            .sidebar {
                top: 0;
                left: 0;

                width: 275px;
                max-width: 85vw;
                height: 100vh;
                height: 100dvh;

                border-radius: 0;

                transform: translateX(-100%);

                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);

                padding: 23px 16px;
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .close-menu {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .logo {
                margin-top: 10px;
                margin-bottom: 22px;
                font-size: 16px;
            }

            .menu-section-title {
                font-size: 10px;
            }

            .menu a {
                min-height: 44px;
                padding: 11px;
                font-size: 13px;
            }

            .logout a {
                min-height: 44px;
                font-size: 13px;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 15px 16px 30px;
            }

            .menu-button {
                display: flex;
            }

            .content {
                max-width: 100%;
            }
        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 520px) {
            body {
                font-size: 13px;
            }

            .main {
                padding: 12px 11px 25px;
            }

            .menu-button {
                width: 39px;
                height: 39px;
                font-size: 18px;
            }

            .content {
                width: 100%;
            }
        }

        /* =========================
           VERY SMALL MOBILE
        ========================= */

        @media (max-width: 380px) {
            .sidebar {
                width: 260px;
                max-width: 88vw;
            }

            .main {
                padding-left: 9px;
                padding-right: 9px;
            }

            .menu-button {
                width: 36px;
                height: 36px;
                font-size: 17px;
            }

            .logo {
                font-size: 15px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    <!-- MOBILE OVERLAY -->
    <div
        class="overlay"
        id="overlay"
        onclick="closeMenu()"
    ></div>

    <!-- COMMON SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <!-- MOBILE CLOSE BUTTON -->
        <button
            class="close-menu"
            onclick="closeMenu()"
            type="button"
            aria-label="Close navigation menu"
        >
            ×
        </button>

        <!-- LOGO -->
        <div class="logo">
            <div class="logo-mark">₹</div>

            <div>
                <span>Expense</span>
                Tracker
            </div>
        </div>

        <!-- MENU -->
        <div class="menu-section-title">Menu</div>

        <ul class="menu">
            <li>
                <a
                    href="{% url 'welcome' %}"
                    class="{% if request.resolver_match.url_name == 'welcome' %}active{% endif %}"
                >
                    <span class="menu-icon">DB</span>
                    Dashboard
                </a>
            </li>
        </ul>

        <!-- TRANSACTIONS -->
        <div class="menu-section-title">Transactions</div>

        <ul class="menu">
            <li>
                <a
                    href="{% url 'add_income' %}"
                    class="{% if request.resolver_match.url_name == 'add_income' or request.resolver_match.url_name == 'edit_income' %}active{% endif %}"
                >
                    <span class="menu-icon">IN</span>
                    Add Income
                </a>
            </li>

            <li>
                <a
                    href="{% url 'add_category' %}"
                    class="{% if request.resolver_match.url_name == 'add_category' or request.resolver_match.url_name == 'edit_category' %}active{% endif %}"
                >
                    <span class="menu-icon">CT</span>
                    Add Category
                </a>
            </li>

            <li>
                <a
                    href="{% url 'add_expense' %}"
                    class="{% if request.resolver_match.url_name == 'add_expense' or request.resolver_match.url_name == 'edit_expense' %}active{% endif %}"
                >
                    <span class="menu-icon">EX</span>
                    Add Expense
                </a>
            </li>
        </ul>

        <!-- ACCOUNT -->
        <div class="menu-section-title">Account</div>

        <ul class="menu">
            <li>
                <a
                    href="{% url 'settings' %}"
                    class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}"
                >
                    <span class="menu-icon">ST</span>
                    Settings
                </a>
            </li>
        </ul>

        <!-- LOGOUT -->
        <div class="logout">
            <a href="{% url 'user_logout' %}">
                Logout
            </a>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- COMMON JAVASCRIPT -->
    <script>
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        function openMenu() {
            sidebar.classList.add("show");
            overlay.classList.add("show");
            document.body.style.overflow = "hidden";
        }

        function closeMenu() {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
            document.body.style.overflow = "";
        }

        /* Close menu after clicking a navigation link */
        const menuLinks = document.querySelectorAll(".menu a");

        menuLinks.forEach(function(link) {
            link.addEventListener("click", function() {
                if (window.innerWidth <= 768) {
                    closeMenu();
                }
            });
        });

        /* Close menu when returning to desktop */
        window.addEventListener("resize", function() {
            if (window.innerWidth > 768) {
                closeMenu();
            }
        });

        /* Close menu using Escape */
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeMenu();
            }
        });
    </script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
