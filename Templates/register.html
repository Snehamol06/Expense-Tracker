<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Expense Tracker</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background: #f5f7f5;

            color: #17221d;

            position: relative;

            overflow-x: hidden;
            overflow-y: auto;
        }


        /* =========================
           BACKGROUND DECORATION
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            background: rgba(184, 240, 0, 0.10);

            border-radius: 50%;

            top: -190px;
            left: -170px;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 360px;
            height: 360px;

            background: rgba(6, 55, 42, 0.06);

            border-radius: 50%;

            right: -160px;
            bottom: -170px;

            pointer-events: none;
        }


        /* =========================
           REGISTER CONTAINER
        ========================= */

        .register-container {
            width: 100%;

            max-width: 430px;

            background: #ffffff;

            padding: 35px 38px;

            border-radius: 16px;

            border: 1px solid #e5ebe6;

            box-shadow:
                0 12px 35px rgba(3, 39, 29, 0.10);

            position: relative;

            z-index: 2;

            margin: auto;
        }


        /* =========================
           LOGO
        ========================= */

        .register-logo {
            width: 52px;
            height: 52px;

            margin: 0 auto 15px;

            background: #06372a;

            color: #b8f000;

            border-radius: 13px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 26px;

            font-weight: bold;

            box-shadow:
                0 6px 14px rgba(3, 39, 29, 0.15);
        }


        /* =========================
           HEADING
        ========================= */

        h1 {
            text-align: center;

            margin-bottom: 7px;

            color: #06372a;

            font-size: 28px;

            line-height: 1.2;

            font-weight: 700;
        }


        .subtitle {
            text-align: center;

            color: #718078;

            font-size: 14px;

            margin-bottom: 25px;

            line-height: 1.5;
        }


        /* =========================
           ERROR
        ========================= */

        .error {
            color: #b42318;

            background: #fff1f0;

            border: 1px solid #ffd5d2;

            text-align: center;

            padding: 10px 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            line-height: 1.4;

            overflow-wrap: anywhere;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {
            width: 100%;

            margin-bottom: 16px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #263a32;

            font-size: 14px;
        }


        /* =========================
           INPUT
        ========================= */

        input {
            display: block;

            width: 100%;

            min-width: 0;

            min-height: 44px;

            padding: 12px 14px;

            border: 1px solid #d8e1db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            background: #ffffff;

            color: #17221d;

            transition: 0.25s ease;
        }


        input::placeholder {
            color: #9aa7a0;
        }


        input:focus {
            border-color: #06372a;

            box-shadow:
                0 0 0 3px rgba(6, 55, 42, 0.08);
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        button {
            display: block;

            width: 100%;

            min-height: 44px;

            padding: 13px;

            margin-top: 3px;

            border: none;

            border-radius: 8px;

            background: #06372a;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 5px 12px rgba(3, 39, 29, 0.13);
        }


        button:hover {
            background: #0b4b38;

            transform: translateY(-1px);
        }


        button:active {
            transform: translateY(0);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            text-align: center;

            margin-top: 20px;

            padding-top: 17px;

            border-top: 1px solid #edf1ee;

            color: #718078;

            font-size: 14px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }


        .login-link a {
            color: #06372a;

            text-decoration: none;

            font-weight: 700;

            margin-left: 3px;

            transition: 0.2s ease;
        }


        .login-link a:hover {
            color: #7ba900;

            text-decoration: underline;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }


            .register-container {
                max-width: 410px;

                padding: 32px;

                border-radius: 14px;
            }


            h1 {
                font-size: 26px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }


            body::before {
                width: 280px;
                height: 280px;

                top: -130px;
                left: -130px;
            }


            body::after {
                width: 250px;
                height: 250px;

                right: -120px;
                bottom: -120px;
            }


            .register-container {
                width: 100%;

                max-width: 100%;

                padding: 28px 21px;

                border-radius: 13px;
            }


            .register-logo {
                width: 48px;
                height: 48px;

                font-size: 24px;

                margin-bottom: 13px;
            }


            h1 {
                font-size: 24px;

                margin-bottom: 7px;
            }


            .subtitle {
                font-size: 13px;

                margin-bottom: 22px;
            }


            .error {
                font-size: 13px;

                padding: 9px 10px;

                margin-bottom: 16px;
            }


            .form-group {
                margin-bottom: 15px;
            }


            label {
                font-size: 13px;

                margin-bottom: 6px;
            }


            input {
                min-height: 44px;

                padding: 12px;

                font-size: 14px;
            }


            button {
                min-height: 44px;

                padding: 12px;

                font-size: 15px;
            }


            .login-link {
                margin-top: 18px;

                padding-top: 15px;

                font-size: 13px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 360px) {

            body {
                padding: 10px;
            }


            .register-container {
                padding: 24px 17px;

                border-radius: 12px;
            }


            .register-logo {
                width: 44px;
                height: 44px;

                font-size: 22px;

                margin-bottom: 12px;
            }


            h1 {
                font-size: 22px;
            }


            .subtitle {
                font-size: 12px;

                margin-bottom: 20px;
            }


            .form-group {
                margin-bottom: 13px;
            }


            label {
                font-size: 12px;
            }


            input {
                min-height: 42px;

                padding: 11px;

                font-size: 13px;
            }


            button {
                min-height: 42px;

                padding: 11px;

                font-size: 14px;
            }


            .login-link {
                font-size: 12px;

                margin-top: 16px;

                padding-top: 14px;
            }
        }


        /* =========================
           LANDSCAPE MOBILE
        ========================= */

        @media (max-height: 600px) and (orientation: landscape) {

            body {
                align-items: flex-start;

                padding-top: 15px;
                padding-bottom: 15px;

                overflow-y: auto;
            }


            .register-container {
                margin: auto;

                padding: 22px 28px;
            }


            .register-logo {
                width: 42px;
                height: 42px;

                font-size: 21px;

                margin-bottom: 9px;
            }


            h1 {
                font-size: 23px;

                margin-bottom: 4px;
            }


            .subtitle {
                font-size: 12px;

                margin-bottom: 15px;
            }


            .form-group {
                margin-bottom: 10px;
            }


            label {
                margin-bottom: 4px;
            }


            input {
                min-height: 38px;

                padding: 9px 11px;
            }


            button {
                min-height: 38px;

                padding: 9px;
            }


            .login-link {
                margin-top: 13px;

                padding-top: 11px;
            }
        }


        /* =========================
           TOUCH DEVICES
        ========================= */

        @media (hover: none) {

            button:hover {
                transform: none;
            }

            .login-link a:hover {
                text-decoration: none;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         REGISTER CARD
    ========================= -->

    <div class="register-container">


        <!-- Logo -->

        <div class="register-logo">
            ₹
        </div>


        <!-- Heading -->

        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Register for Expense Tracker
        </p>


        <!-- Error -->

        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <!-- Register Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <!-- Register Button -->

            <button type="submit">
                Register
            </button>

        </form>


        <!-- Login Link -->

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>


    </div>


</body>
</html>
